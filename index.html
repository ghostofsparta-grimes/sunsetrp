
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Naija Legacy RP Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121f;
    --bg-card: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --text-primary: #e8e8e8;
    --text-secondary: #8b8b9a;
    --accent: #00d4aa;
    --accent-orange: #ff6b35;
    --accent-red: #ff4757;
    --accent-blue: #3742fa;
    --accent-purple: #a55eea;
    --accent-gold: #ffd700;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

.login-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow);
    animation: slideUp 0.6s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-card .logo { text-align: center; font-size: 48px; margin-bottom: 8px; }
.login-card h2 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.login-card .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }

.input-group { margin-bottom: 16px; position: relative; }
.input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; }
.input-group input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: rgba(255,255,255,0.02);
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
}
.input-group input:focus { border-color: var(--accent); background: rgba(255,255,255,0.04); box-shadow: 0 0 0 3px rgba(0,212,170,0.1); }

.btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #00a884);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Inter', sans-serif;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,212,170,0.4); }
.btn-primary:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }

.msg { text-align: center; margin-top: 16px; font-size: 14px; min-height: 20px; font-weight: 500; }
.msg.success { color: var(--accent); }
.msg.error { color: var(--accent-red); }
.msg.loading { color: var(--accent-orange); }

.dashboard { display: none; min-height: 100vh; }

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 280px;
    height: 100vh;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    overflow-y: auto;
    z-index: 100;
    transition: transform 0.3s;
}

.sidebar-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
}

.sidebar-header .avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: white;
}

.sidebar-header .info h4 { font-size: 14px; font-weight: 600; }
.sidebar-header .info span { font-size: 12px; color: var(--text-secondary); }

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 4px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
}
.nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
.nav-item.active {
    background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(55,66,250,0.15));
    color: var(--accent);
    border: 1px solid rgba(0,212,170,0.2);
}
.nav-item i { width: 20px; text-align: center; }

.main-content {
    margin-left: 280px;
    padding: 32px;
    min-height: 100vh;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
}

.top-bar h1 { font-size: 28px; font-weight: 700; }

.btn-logout {
    padding: 10px 20px;
    background: rgba(255,71,87,0.1);
    border: 1px solid rgba(255,71,87,0.3);
    border-radius: 10px;
    color: var(--accent-red);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
}
.btn-logout:hover { background: rgba(255,71,87,0.2); }

.profile-hero {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 24px;
    align-items: center;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
}

.profile-hero .skin-image {
    width: 100px;
    height: 160px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 4px 20px rgba(0,212,170,0.3);
}

.profile-hero .details h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.profile-hero .details .badges { display: flex; gap: 8px; flex-wrap: wrap; }

.badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.badge-admin { background: rgba(255,107,53,0.15); color: var(--accent-orange); border: 1px solid rgba(255,107,53,0.3); }
.badge-helper { background: rgba(55,66,250,0.15); color: var(--accent-blue); border: 1px solid rgba(55,66,250,0.3); }
.badge-vip { background: rgba(255,215,0,0.15); color: var(--accent-gold); border: 1px solid rgba(255,215,0,0.3); }
.badge-faction { background: rgba(165,94,234,0.15); color: var(--accent-purple); border: 1px solid rgba(165,94,234,0.3); }

.profile-hero .quick-stats { display: flex; gap: 24px; }
.quick-stat { text-align: center; }
.quick-stat .value { font-size: 24px; font-weight: 700; color: var(--accent); }
.quick-stat .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

.section { display: none; animation: fadeIn 0.4s ease; }
.section.active { display: block; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.section-title i { color: var(--accent); }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
}

.stat-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}
.stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-blue));
    opacity: 0;
    transition: opacity 0.3s;
}
.stat-card:hover::before { opacity: 1; }

.stat-card .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-bottom: 12px;
}
.stat-card .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-card .value { font-size: 20px; font-weight: 700; color: var(--text-primary); word-break: break-word; }
.stat-card .value.small { font-size: 14px; }

.vehicle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.vehicle-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s;
}
.vehicle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border-color: rgba(255,255,255,0.1);
}

.vehicle-card .vehicle-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
}

.vehicle-card .vehicle-info { padding: 20px; }
.vehicle-card .vehicle-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.vehicle-card .vehicle-meta {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}
.vehicle-card .vehicle-meta span {
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    padding: 4px 10px;
    border-radius: 6px;
}

.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
}
.status-spawned { background: rgba(0,212,170,0.15); color: var(--accent); }
.status-despawned { background: rgba(255,71,87,0.15); color: var(--accent-red); }
.status-impounded { background: rgba(255,107,53,0.15); color: var(--accent-orange); }
.status-broken { background: rgba(255,71,87,0.1); color: #ff6b6b; }
.status-garage { background: rgba(55,66,250,0.15); color: var(--accent-blue); }

.org-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
}

.org-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
}
.org-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.1);
    box-shadow: var(--shadow);
}

.org-card .org-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}

.org-card .org-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
}

.org-card .org-name { font-size: 18px; font-weight: 700; }
.org-card .org-type {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.org-card .org-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

.org-card .org-stat { text-align: center; }
.org-card .org-stat .num { font-size: 18px; font-weight: 700; color: var(--accent); }
.org-card .org-stat .lbl { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }

#map {
    width: 100%;
    height: 500px;
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
}

/* Table wrapper for horizontal scroll */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 16px;
    border: 1px solid var(--border);
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    min-width: 600px;
}

.data-table th,
.data-table td {
    padding: 14px 20px;
    text-align: left;
    font-size: 14px;
    white-space: nowrap;
}

.data-table th {
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
}

.data-table td {
    border-top: 1px solid var(--border);
    color: var(--text-primary);
}

.data-table tr:hover td { background: rgba(255,255,255,0.02); }

.mobile-toggle {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 200;
    width: 40px;
    height: 40px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* ========== MOBILE RESPONSIVE ========== */
@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); width: 260px; }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; padding: 80px 16px 20px; }
    .mobile-toggle { display: flex; }
    
    /* Profile hero - stack vertically */
    .profile-hero { 
        grid-template-columns: 1fr; 
        text-align: center; 
        padding: 20px;
        gap: 16px;
    }
    .profile-hero .skin-image { 
        width: 80px; 
        height: 130px; 
        margin: 0 auto; 
    }
    .profile-hero .quick-stats { 
        justify-content: center; 
        gap: 16px;
        flex-wrap: wrap;
    }
    .profile-hero .details h2 { font-size: 20px; }
    
    /* Stats grid - smaller cards */
    .stats-grid { 
        grid-template-columns: repeat(2, 1fr); 
        gap: 12px;
    }
    .stat-card { padding: 16px; }
    .stat-card .value { font-size: 16px; }
    .stat-card .value.small { font-size: 12px; }
    
    /* Vehicle & org grids - single column */
    .vehicle-grid, .org-grid { 
        grid-template-columns: 1fr; 
        gap: 16px;
    }
    
    /* Top bar */
    .top-bar { margin-bottom: 20px; padding-bottom: 16px; }
    .top-bar h1 { font-size: 22px; }
    
    /* Section title */
    .section-title { font-size: 18px; margin-bottom: 16px; }
    
    /* Data tables - scrollable */
    .data-table th, .data-table td { 
        padding: 12px 16px; 
        font-size: 13px;
    }
    
    /* Login card */
    .login-card { padding: 32px 24px; }
    .login-card h2 { font-size: 24px; }
}

/* Extra small screens */
@media (max-width: 480px) {
    .stats-grid { 
        grid-template-columns: 1fr; 
    }
    
    .profile-hero .quick-stats { 
        gap: 12px;
    }
    .quick-stat .value { font-size: 20px; }
    
    .badge { 
        font-size: 10px; 
        padding: 3px 10px; 
    }
    
    .btn-logout { 
        padding: 8px 16px; 
        font-size: 12px; 
    }
    
    /* Chat mobile fixes */
    .chat-container { 
        height: calc(100vh - 200px) !important; 
    }
}

.chat-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.chat-tab {
    padding: 8px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
}
.chat-tab:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
}
.chat-tab.active {
    background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(55,66,250,0.15));
    color: var(--accent);
    border-color: rgba(0,212,170,0.3);
}

.friend-card {
    cursor: pointer;
    transition: all 0.2s;
}
.friend-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.1);
}

.profile-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(10px);
}
.profile-modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.3s ease;
}

/* WhatsApp-style Chat */
.chat-app {
    display: flex;
    height: 75vh;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
}

.chat-sidebar {
    width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
}

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-search {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.chat-search input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
}

.chat-search input:focus {
    border-color: var(--accent);
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 1px solid rgba(255,255,255,0.02);
}

.chat-list-item:hover {
    background: rgba(255,255,255,0.03);
}

.chat-list-item.active {
    background: rgba(0,212,170,0.08);
}

.chat-list-item .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.chat-list-item .info {
    flex: 1;
    min-width: 0;
}

.chat-list-item .name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
    color: var(--text-primary);
}

.chat-list-item .preview {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-secondary);
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.chat-msg-username {
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s;
}
.chat-msg-username:hover {
    opacity: 0.8;
    text-decoration: underline;
}

@media (max-width: 768px) {
    .chat-sidebar { width: 100%; height: 100%; }
    .chat-main { display: none !important; width: 100%; height: 100%; }
    .chat-main.force-show { display: flex !important; }
    .chat-sidebar.force-hide { display: none !important; }
}


.loading-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    color: var(--text-secondary);
    font-size: 14px;
}
.loading-spinner i { margin-right: 8px; animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}
.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-primary); }

</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">

                <span id="sidebarRank">Member</span>
            </div>

        <nav>
            <div class="nav-item active" onclick="showSection('player', this)">

            </div>

            <div class="nav-item" onclick="showSection('map', this)">

            </div>

            </div>

                <i class="fas fa-skull"></i> Gangs
            </div>

                <i class="fas fa-map-pin"></i> Points
            </div>

            </div>
            <div class="nav-item" onclick="showSection('chat', this)">
                <i class="fas fa-comments"></i> Chat
           </div>
           <div class="nav-item" onclick="showSection('friends', this)">
               <i class="fas fa-user-friends"></i> Friends
          </div>
        </nav>
    </aside>
    
    <main class="main-content">
        <div class="top-bar">
            <h1 id="pageTitle">Player Details</h1>
            <div class="actions">
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <div class="profile-hero" id="profileHero">
            <img class="skin-image" id="heroSkin" src="https://files.sa-mp.com/skins/0.png" alt="Skin" onerror="this.src='https://files.sa-mp.com/skins/0.png'">
            <div class="details">
                <h2 id="heroName">Player</h2>
                <div class="badges" id="heroBadges"></div>
            </div>
            <div class="quick-stats" id="heroStats"></div>
        </div>
        
        <div id="sectionsContainer"></div>
    </main>
</div>

<script>
const API = "https://sampapi.onrender.com";
let userData = null;
let currentMap = null;

let lastSeenIds = { general: 0, admin: 0, faction: 0, gang: 0 };
let lastDmSeen = {}; // { otherUid: lastId }
let pollInterval = null;

window.onload = () => {
    const token = localStorage.getItem("token");
    if (token) loadDashboard();
};

document.getElementById("password").addEventListener("keypress", (e) => {
    if (e.key === "Enter") login();
});

async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    msg.className = "";
    msg.innerText = "";

    if (!username || !password) {
        msg.innerText = "Please fill all fields";
        msg.className = "error";
        return;
    }

    btn.disabled = true;
    msg.innerText = "Authenticating...";
    msg.className = "loading";

    try {
        const res = await fetch(API + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
            msg.innerText = "Success!";
            msg.className = "success";
            localStorage.setItem("token", data.token);
            localStorage.setItem("uid", data.uid);
            localStorage.setItem("username", data.username);
            setTimeout(loadDashboard, 500);
        } else {
            msg.innerText = data.message || "Login failed";
            msg.className = "error";
        }
    } catch (err) {
        msg.innerText = "Cannot connect to server";
        msg.className = "error";
    }

    btn.disabled = false;
}

async function loadDashboard() {
    const token = localStorage.getItem("token");
    if (!token) return logout();

    try {
        const res = await fetch(API + "/stats", {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        
        if (!data.success) {
            if (res.status === 401) return logout();
            alert(data.message);
            return;
        }

        userData = data.data;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        renderDashboard();
        startChatPolling(); // ADD THIS
    } catch (err) {
        console.error(err);
        logout();
    }
}

function renderDashboard() {
    const d = userData;
    const name = d.username || localStorage.getItem("username") || "Player";
    const initial = name.charAt(0).toUpperCase();
    
    document.getElementById("sidebarAvatar").innerText = initial;
    document.getElementById("sidebarName").innerText = name;
    
    const rankText = d.adminlevel > 0 ? `Admin ${d.adminlevel}` : d.helperlevel > 0 ? `Helper ${d.helperlevel}` : d.vippackage > 0 ? "VIP" : "Member";
    document.getElementById("sidebarRank").innerText = rankText;
    
    document.getElementById("heroSkin").src = `https://sa-skins.netlify.app/${d.skin || 0}.png`;
    document.getElementById("heroName").innerText = name;
    
    const badges = document.getElementById("heroBadges");
    badges.innerHTML = "";
    if (d.adminlevel > 0) badges.innerHTML += `<span class="badge badge-admin">Admin ${d.adminlevel}</span>`;
    if (d.helperlevel > 0) badges.innerHTML += `<span class="badge badge-helper">Helper ${d.helperlevel}</span>`;
    if (d.vippackage > 0) badges.innerHTML += `<span class="badge badge-vip">VIP ${d.vippackage}</span>`;
    if (d.faction > 0) badges.innerHTML += `<span class="badge badge-faction">Faction</span>`;
    
    const heroStats = document.getElementById("heroStats");
    heroStats.innerHTML = `
        <div class="quick-stat"><div class="value">${d.level || 0}</div><div class="label">Level</div></div>
        <div class="quick-stat"><div class="value">$${formatNum(d.cash || 0)}</div><div class="label">Cash</div></div>
        <div class="quick-stat"><div class="value">${d.hours || 0}h</div><div class="label">Played</div></div>
        <div class="quick-stat"><div class="value">${Math.floor(d.health || 100)}</div><div class="label">Health</div></div>
    `;
    
    buildSections();
    showSection('player', document.querySelector('.nav-item.active'));
}

function startChatPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(pollForNewMessages, 5000); // Check every 5 seconds
}

function stopChatPolling() {
    if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
    }
}

async function pollForNewMessages() {
    const token = localStorage.getItem("token");
    if (!token || !userData) return;

    try {
        // Poll inbox to get latest message IDs
        const res = await fetch(API + "/chat/inbox", {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.success) return;

        // Check groups
        for (const g of data.data.groups) {
            await checkCategoryForNewMessages(g.category);
        }

        // Check DMs
        for (const dm of data.data.dms) {
            await checkDmForNewMessages(dm.otherUid, dm.name, dm.skin);
        }
    } catch (err) {
        // Silently fail on poll errors
    }
}

async function checkCategoryForNewMessages(category) {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/chat?category=" + category, {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.success || !data.data.length) return;

        const lastMsg = data.data[data.data.length - 1];
        const prevId = lastSeenIds[category] || 0;

        if (lastMsg.id > prevId) {
            lastSeenIds[category] = lastMsg.id;

            // Only notify if not currently viewing this chat and tab is hidden
            const isViewingThis = currentChat.category === category && !currentChat.otherUid;
            const isVisible = document.visibilityState === 'visible';

            if (!isViewingThis || !isVisible) {
                const sender = lastMsg.uid === parseInt(localStorage.getItem("uid")) ? "You" : lastMsg.username;
                showNotif(
                    category === 'general' ? 'General Chat' : 
                    category === 'admin' ? 'Admin Chat' : 
                    category === 'faction' ? 'Faction Chat' : 'Gang Chat',
                    `${sender}: ${lastMsg.message.substring(0, 60)}`
                );
            }
        }
    } catch (err) {}
}

async function checkDmForNewMessages(otherUid, name, skin) {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/chat?category=dm&otherUid=" + otherUid, {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.success || !data.data.length) return;

        const lastMsg = data.data[data.data.length - 1];
        const prevId = lastDmSeen[otherUid] || 0;

        if (lastMsg.id > prevId) {
            lastDmSeen[otherUid] = lastMsg.id;

            const isViewingThis = currentChat.category === 'dm' && currentChat.otherUid == otherUid;
            const isVisible = document.visibilityState === 'visible';

            if (!isViewingThis || !isVisible) {
                const sender = lastMsg.uid === parseInt(localStorage.getItem("uid")) ? "You" : lastMsg.username;
                showNotif(name, `${sender}: ${lastMsg.message.substring(0, 60)}`);
            }
        }
    } catch (err) {}
}

async function muteUser(targetUid, minutes) {
    const token = localStorage.getItem("token");
    const reason = prompt("Mute reason:");
    if (!reason) return;
    
    try {
        const res = await fetch(API + "/admin/mute", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ targetUid, reason, duration: minutes })
        });
        const data = await res.json();
        alert(data.message);
    } catch (err) {
        console.error(err);
        alert("Failed to mute");
    }
}


async function showSection(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    const section = document.getElementById('section-' + id);
    if (section) section.classList.add('active');
    if (el) el.classList.add('active');
    
    const titles = {
        player: "Player Details", vehicles: "My Vehicles", houses: "My Houses",
        map: "Live Map", factions: "Factions", gangs: "Gangs",
        points: "Points", turfs: "Turfs", chat: "Chat", friends: "Friends"
    };

    document.getElementById('pageTitle').innerText = titles[id] || id;
    
    document.getElementById('profileHero').style.display = id === 'player' ? 'grid' : 'none';
    document.getElementById('sidebar').classList.remove('open');
    
    const loaders = {
        vehicles: loadVehicles, houses: loadHouses, map: loadMap,
        factions: loadFactions, gangs: loadGangs, points: loadPoints, 
        turfs: loadTurfs, chat: loadChat, friends: loadFriends
    };
    
    if (loaders[id]) await loaders[id]();
}



function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

let replyToId = null;
let replyToUsername = null;
let chatStickers = [];
let currentChat = { category: null, otherUid: null, name: '', icon: '', skin: 0 };
let chatListData = { groups: [], dms: [] };

async function loadChat() {
    const token = localStorage.getItem("token");
    const content = document.getElementById("content-chat");
    const loader = document.getElementById("loader-chat");
    if (!content || !loader) return;
    
    if (!chatStickers.length) {
        try {
            const sres = await fetch(API + "/stickers", { headers: { "Authorization": "Bearer " + token }});
            const sdata = await sres.json();
            if (sdata.success) chatStickers = sdata.data;
        } catch(e) {}
    }
    
    content.innerHTML = `
        <div class="chat-app" id="chatApp">
            <div class="chat-sidebar" id="chatSidebar">
                <div class="chat-search">
                    <input type="text" id="chatSearchInput" placeholder="Search players to message..." autocomplete="off">
                    <div id="chatSearchResults" style="display:none;margin-top:8px;"></div>
                </div>
                <div class="chat-list" id="chatList"></div>
            </div>
            <div class="chat-main" id="chatMain">
                <div id="chatEmpty" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">
                    <i class="fas fa-comments" style="font-size:48px;margin-bottom:16px;opacity:0.3;"></i>
                    <h3>Select a chat</h3>
                    <p>Choose a conversation or search for a player</p>
                </div>
                <div id="chatActive" style="display:none;flex-direction:column;height:100%;">
                    <div class="chat-header" id="chatHeader"></div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div id="reply-bar" style="display:none;padding:8px 16px;background:rgba(0,212,170,0.1);border-top:1px solid var(--border);font-size:12px;color:var(--accent);align-items:center;gap:8px;">
                        <i class="fas fa-reply"></i> Replying to <span id="reply-name"></span>
                        <button onclick="cancelReply()" style="margin-left:auto;background:none;border:none;color:var(--text-secondary);cursor:pointer;"><i class="fas fa-times"></i></button>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--bg-secondary);align-items:center;">
                        <button onclick="toggleStickers()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:18px;padding:8px;"><i class="fas fa-smile"></i></button>
                        <input id="chat-input" type="text" placeholder="Type a message..." maxlength="256" 
                            style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);color:var(--text-primary);font-family:Inter,sans-serif;outline:none;font-size:14px;">
                        <button onclick="sendMessage()" class="btn-primary" style="width:auto;padding:10px 20px;">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div id="sticker-picker" style="display:none;padding:12px;border-top:1px solid var(--border);background:var(--bg-secondary);gap:8px;flex-wrap:wrap;max-height:120px;overflow-y:auto;">
                        ${chatStickers.map(s => `
                            <button onclick="sendSticker('${s.code}')" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:8px;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='none'">
                                <img src="${s.url}" style="width:40px;height:40px;object-fit:contain;" title="${s.name}">
                            </button>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;
    
    loader.style.display = "none";
    
    const searchInput = document.getElementById("chatSearchInput");
    let searchTimeout;
    searchInput.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        const q = e.target.value.trim();
        if (q.length < 2) {
            document.getElementById("chatSearchResults").style.display = "none";
            renderChatList();
            return;
        }
        searchTimeout = setTimeout(() => searchPlayers(q), 300);
    });
    
    await loadChatInbox();
    
    if (currentChat.category) {
        await openChat(currentChat.category, currentChat.otherUid, currentChat.name, currentChat.icon, currentChat.skin);
    }
}

async function loadChatInbox() {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/chat/inbox", { headers: { "Authorization": "Bearer " + token }});
        const data = await res.json();
        if (data.success) {
            chatListData = data.data;
            renderChatList();
        }
    } catch (err) { console.error(err); }
}

function renderChatList() {
    const list = document.getElementById("chatList");
    if (!list) return;
    
    let html = '';
    
    for (const g of chatListData.groups) {
        const isActive = currentChat.category === g.category && !currentChat.otherUid;
        const grad = {
            general: 'linear-gradient(135deg,var(--accent),var(--accent-blue))',
            admin: 'linear-gradient(135deg,var(--accent-orange),var(--accent-red))',
            faction: 'linear-gradient(135deg,var(--accent-purple),var(--accent-blue))',
            gang: 'linear-gradient(135deg,var(--accent-red),#2f3542)'
        }[g.category] || 'linear-gradient(135deg,var(--accent),var(--accent-blue))';
        
        html += `
            <div class="chat-list-item ${isActive ? 'active' : ''}" onclick="openChat('${g.category}', null, '${g.name}', '${g.icon}')">
                <div class="avatar" style="background:${grad};color:white;"><i class="fas ${g.icon}"></i></div>
                <div class="info"><div class="name">${g.name}</div><div class="preview">Group chat</div></div>
            </div>
        `;
    }
    
    if (chatListData.dms.length > 0) {
        html += `<div style="padding:10px 16px 6px;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Direct Messages</div>`;
        for (const dm of chatListData.dms) {
            const isActive = currentChat.category === 'dm' && currentChat.otherUid == dm.otherUid;
            const time = new Date(dm.lastTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            html += `
                <div class="chat-list-item ${isActive ? 'active' : ''}" onclick="openChat('dm', ${dm.otherUid}, '${escapeHtml(dm.name)}', 'fa-user', ${dm.skin||0})">
                    <img src="https://sa-skins.netlify.app/${dm.skin||0}.png" style="width:44px;height:44px;object-fit:cover;border-radius:50%;border:2px solid ${isActive?'var(--accent)':'var(--border)'};flex-shrink:0;">
                    <div class="info" style="min-width:0;">
                        <div class="name">${escapeHtml(dm.name)}</div>
                        <div class="preview">${escapeHtml(dm.lastMessage || 'No messages')}</div>
                    </div>
                    <div style="font-size:11px;color:var(--text-secondary);flex-shrink:0;">${time}</div>
                </div>
            `;
        }
    }
    
    list.innerHTML = html;
}

async function searchPlayers(q) {
    const token = localStorage.getItem("token");
    const resultsDiv = document.getElementById("chatSearchResults");
    try {
        const res = await fetch(API + "/players/search?q=" + encodeURIComponent(q), { headers: { "Authorization": "Bearer " + token }});
        const data = await res.json();
        
        if (data.success && data.data.length) {
            let html = '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">';
            for (const p of data.data) {
                html += `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:all 0.2s;" 
                         onmouseover="this.style.background='rgba(255,255,255,0.03)'" onmouseout="this.style.background='none'"
                         onclick="startDM(${p.uid}, '${escapeHtml(p.username)}', ${p.skin||0})">
                        <img src="https://sa-skins.netlify.app/${p.skin||0}.png" style="width:36px;height:36px;object-fit:cover;border-radius:50%;">
                        <div style="flex:1;"><div style="font-weight:600;font-size:13px;">${escapeHtml(p.username)}</div><div style="font-size:11px;color:var(--text-secondary);">Level ${p.level}</div></div>
                        <i class="fas fa-comment" style="color:var(--accent);font-size:14px;"></i>
                    </div>`;

        } else {
            resultsDiv.innerHTML = '<div style="padding:10px;color:var(--text-secondary);font-size:13px;">No players found</div>';
            resultsDiv.style.display = 'block';
        }
    } catch (err) { console.error(err); }
}

function startDM(otherUid, username, skin) {
    document.getElementById("chatSearchResults").style.display = "none";
    document.getElementById("chatSearchInput").value = "";
    openChat('dm', otherUid, username, 'fa-user', skin);
}

async function openChat(category, otherUid, name, icon, skin) {
    currentChat = { category, otherUid, name, icon, skin };
    document.getElementById("chatEmpty").style.display = "none";
    document.getElementById("chatActive").style.display = "flex";
    
    const header = document.getElementById("chatHeader");
    if (category === 'dm') {
        header.innerHTML = `
            <button onclick="backToChatList()" style="display:none;background:none;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;margin-right:4px;" class="mobile-back-btn"><i class="fas fa-arrow-left"></i></button>
            <img src="https://sa-skins.netlify.app/${skin||0}.png" style="width:40px;height:40px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);cursor:pointer;" onclick="viewPlayerProfile(${otherUid})">
            <div style="flex:1;cursor:pointer;" onclick="viewPlayerProfile(${otherUid})">
                <div style="font-weight:600;font-size:15px;">${escapeHtml(name)}</div>
                <div style="font-size:12px;color:var(--text-secondary);">Direct Message</div>
            </div>
        `;
    } else {
        const grad = {
            general: 'linear-gradient(135deg,var(--accent),var(--accent-blue))',
            admin: 'linear-gradient(135deg,var(--accent-orange),var(--accent-red))',
            faction: 'linear-gradient(135deg,var(--accent-purple),var(--accent-blue))',
            gang: 'linear-gradient(135deg,var(--accent-red),#2f3542)'
        }[category] || 'linear-gradient(135deg,var(--accent),var(--accent-blue))';
        header.innerHTML = `
            <button onclick="backToChatList()" style="display:none;background:none;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;margin-right:4px;" class="mobile-back-btn"><i class="fas fa-arrow-left"></i></button>
            <div class="avatar" style="background:${grad};color:white;width:40px;height:40px;"><i class="fas ${icon}"></i></div>
            <div style="flex:1;"><div style="font-weight:600;font-size:15px;">${escapeHtml(name)}</div><div style="font-size:12px;color:var(--text-secondary);">Group chat</div></div>
        `;
    }
    
    if (window.innerWidth <= 768) {
        document.getElementById("chatSidebar").classList.add("force-hide");
        document.getElementById("chatMain").classList.add("force-show");
        document.querySelectorAll(".mobile-back-btn").forEach(b => b.style.display = "block");
    }
    
    renderChatList();
    await loadMessages(category, otherUid);
}

function backToChatList() {
    if (window.innerWidth <= 768) {
        document.getElementById("chatSidebar").classList.remove("force-hide");
        document.getElementById("chatMain").classList.remove("force-show");
    }
    currentChat = { category: null, otherUid: null, name: '', icon: '', skin: 0 };
    renderChatList();
}

async function loadMessages(category, otherUid) {
    const token = localStorage.getItem("token");
    const container = document.getElementById("chatMessages");
    let url = API + "/chat?category=" + category;
    if (category === 'dm' && otherUid) url += "&otherUid=" + otherUid;
    
    try {
        const res = await fetch(url, { headers: { "Authorization": "Bearer " + token }});
        const data = await res.json();
        
        if (!data.success) {
            container.innerHTML = `<div class="empty-state" style="padding:40px;"><h3>${data.message}</h3></div>`;
            return;
        }
        if (!data.data.length) {
            container.innerHTML = `<div class="empty-state" style="padding:40px;"><i class="fas fa-comment" style="font-size:40px;opacity:0.3;margin-bottom:12px;"></i><h3>No messages yet</h3><p>Send a message to start the conversation</p></div>`;
        } else {
            container.innerHTML = data.data.map(msg => {
                const isMe = msg.uid === parseInt(localStorage.getItem("uid"));
                return renderChatMessage(msg, isMe);
            }).join('');
        }
        container.scrollTop = container.scrollHeight;
        
        if (data.data.length > 0) {
            const lastId = data.data[data.data.length - 1].id;
            
            // Mark as read
            fetch(API + "/chat/read", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ category, otherUid, lastId })
            }).catch(() => {});
            
            // Track last seen ID so polling doesn't re-notify
            if (category === 'dm' && otherUid) {
                lastDmSeen[otherUid] = lastId;
            } else {
                lastSeenIds[category] = lastId;
            }
        }
    } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state"><h3>Error loading messages</h3></div>`;
    }
}


async function sendMessage() {
    const input = document.getElementById("chat-input");
    const message = input?.value.trim();
    if (!message || !currentChat.category) return;
    
    const token = localStorage.getItem("token");
    try {
        const body = { message, category: currentChat.category };
        if (currentChat.category === 'dm') body.recipientUid = currentChat.otherUid;
        if (replyToId) body.replyTo = replyToId;
        
        const res = await fetch(API + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        
        if (data.success) {
            input.value = "";
            cancelReply();
            await loadMessages(currentChat.category, currentChat.otherUid);
            await loadChatInbox();
        } else {
            alert(data.message || "Failed to send");
        }
    } catch (err) {
        console.error(err);
        alert("Cannot send message");
    }
}


function renderChatMessage(msg, isMe) {
    const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const align = isMe ? 'flex-end' : 'flex-start';
    const bg = isMe ? 'linear-gradient(135deg, var(--accent), #00a884)' : 'var(--bg-secondary)';
    const color = isMe ? 'white' : 'var(--text-primary)';
    const border = isMe ? 'none' : '1px solid var(--border)';
    
    let reactionsHtml = '';
    if (msg.reactions) {
        const reactions = typeof msg.reactions === 'string' ? JSON.parse(msg.reactions) : msg.reactions;
        const reactionEntries = Object.entries(reactions).filter(([_, users]) => users.length > 0);
        if (reactionEntries.length) {
            reactionsHtml = `<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;">`;
            for (const [emoji, users] of reactionEntries) {
                reactionsHtml += `<button onclick="reactToMessage(${msg.id}, '${emoji}')" style="background:rgba(255,255,255,0.1);border:none;border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;color:${color};display:flex;align-items:center;gap:4px;">${emoji} ${users.length}</button>`;
            }
            reactionsHtml += `</div>`;
        }
    }
    
    let replyHtml = '';
    if (msg.reply_to && msg.reply_username) {
        replyHtml = `<div style="font-size:11px;color:${isMe ? 'rgba(255,255,255,0.7)' : 'var(--text-secondary)'};margin-bottom:4px;padding-left:8px;border-left:2px solid ${isMe ? 'rgba(255,255,255,0.5)' : 'var(--accent)'};"><i class="fas fa-reply" style="font-size:9px;"></i> ${escapeHtml(msg.reply_username)}</div>`;
    }
    
    let messageText = escapeHtml(msg.message);
    chatStickers.forEach(s => {
        messageText = messageText.replace(new RegExp(escapeRegex(s.code), 'g'), `<img src="${s.url}" style="width:48px;height:48px;object-fit:contain;vertical-align:middle;" title="${s.name}">`);
    });
    
    const showDelete = isMe || userData?.adminlevel > 0;
    const deleteBtn = showDelete ? `<button onclick="deleteMessage(${msg.id})" style="background:none;border:none;color:${isMe ? 'rgba(255,255,255,0.6)' : 'var(--text-secondary)'};cursor:pointer;font-size:11px;padding:2px;margin-left:4px;opacity:0;transition:opacity 0.2s;" class="msg-delete-btn"><i class="fas fa-trash"></i></button>` : '';
    const replyBtn = `<button onclick="startReply(${msg.id}, '${escapeHtml(msg.username)}')" style="background:none;border:none;color:${isMe ? 'rgba(255,255,255,0.6)' : 'var(--text-secondary)'};cursor:pointer;font-size:11px;padding:2px;opacity:0;transition:opacity 0.2s;" class="msg-reply-btn"><i class="fas fa-reply"></i></button>`;
    
    return `
        <div style="display:flex;flex-direction:column;align-items:${align};max-width:75%;align-self:${align};" 
             onmouseenter="this.querySelectorAll('.msg-delete-btn,.msg-reply-btn').forEach(b=>b.style.opacity='1')" 
             onmouseleave="this.querySelectorAll('.msg-delete-btn,.msg-reply-btn').forEach(b=>b.style.opacity='0')">
            <div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px;padding:0 4px;display:flex;align-items:center;gap:4px;word-break:break-word;">
                <span class="chat-msg-username" style="color:${isMe ? 'rgba(255,255,255,0.85)' : 'var(--accent)'}" onclick="viewPlayerProfile(${msg.uid})">${escapeHtml(msg.username)}</span>
                <span>· ${time}</span> ${replyBtn} ${deleteBtn}
            </div>
            <div style="background:${bg};color:${color};padding:10px 14px;border-radius:16px;border:${border};font-size:14px;line-height:1.4;word-break:break-word;${msg.reply_to ? 'border-top-left-radius:4px;' : ''}">
                ${replyHtml}${messageText}
            </div>
            ${reactionsHtml}
            <div style="display:flex;gap:4px;margin-top:4px;padding-left:4px;">
                ${['👍','❤️','😂','😮','😢','🙏'].map(emoji => `
                    <button onclick="reactToMessage(${msg.id}, '${emoji}')" style="background:none;border:none;cursor:pointer;font-size:14px;opacity:0.6;transition:opacity 0.2s;padding:2px;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">${emoji}</button>
                `).join('')}
            </div>
        </div>
    `;
}

async function deleteMessage(msgId) {
    if (!confirm("Delete this message?")) return;
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/chat/" + msgId, { method: "DELETE", headers: { "Authorization": "Bearer " + token }});
        const data = await res.json();
        if (data.success) await loadMessages(currentChat.category, currentChat.otherUid);
        else alert(data.message || "Failed to delete");
    } catch (err) { console.error(err); alert("Cannot delete message"); }
}

async function reactToMessage(msgId, emoji) {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/chat/" + msgId + "/react", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ emoji })
        });
        const data = await res.json();
        if (data.success) await loadMessages(currentChat.category, currentChat.otherUid);
    } catch (err) { console.error(err); }
}


function escapeRegex(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

async function loadFactions() {
    const content = document.getElementById("content-factions");
    const loader = document.getElementById("loader-factions");
    if (!content || !loader) return;
    
    try {
        const res = await fetch(API + "/factions");

                <div class="org-card">

async function loadMap() {
    const token = localStorage.getItem("token");
    const content = document.getElementById("content-map");
    const loader = document.getElementById("loader-map");
    if (!content || !loader) return;
    
    content.innerHTML = `
        <div id="map" style="width:100%;height:600px;border-radius:16px;border:1px solid var(--border);margin-bottom:20px;"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
            <div class="stat-card">
                <div class="icon" style="background:linear-gradient(135deg,#00d4aa,#00a884);color:white;"><i class="fas fa-car"></i></div>
                <div class="label">Vehicles</div>
                <div class="value small" id="map-vehicle-count">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="icon" style="background:linear-gradient(135deg,#ff6b35,#ff4757);color:white;"><i class="fas fa-home"></i></div>
                <div class="label">Houses</div>
                <div class="value small" id="map-house-count">Loading...</div>
            </div>
        </div>
    `;
    loader.style.display = "none";
    
    // Initialize Leaflet map with SA-MP satellite tiles
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: 0,
        maxZoom: 6,
        zoom: 2,
        center: [1500, 1500]
    });
    
    // Add SA-MP SATELLITE map tiles
    L.tileLayer('http://tiles.gtadb.com/gtasa/satellite/{z}/{x}/{y}.png', {
        attribution: 'SA-MP Satellite Map',
        tileSize: 256,
        minZoom: 0,
        maxZoom: 6,
        noWrap: true
    }).addTo(map);
    
    // Custom marker icons
    const carIcon = L.divIcon({
        className: 'custom-marker',
        html: '<div style="background:#00d4aa;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 12px rgba(0,212,170,0.6);animation:pulse 2s infinite;"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
    });
    
    const houseIcon = L.divIcon({
        className: 'custom-marker',
        html: '<div style="background:#ff6b35;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 12px rgba(255,107,53,0.6);"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
    });
    
    // Add pulse animation
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    `;
    document.head.appendChild(style);
    
    // Fetch and display locations
    try {
        const res = await fetch(API + "/map-data", { headers: { "Authorization": "Bearer " + token }});
        const data = await res.json();
        
        if (data.success) {
            let vehicleCount = 0;
            let houseCount = 0;
            
            // Add vehicle markers
            for (const v of data.data.vehicles) {
                if (v.x && v.y) {
                    // Convert SA coords to map coords
                    // SA map is 3000x3000, origin at center (0,0)
                    // Leaflet Simple CRS: [y, x] with 0,0 at top-left
                    const lat = 3000 - (v.y + 1500);
                    const lng = v.x + 1500;
                    
                    L.marker([lat, lng], { icon: carIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="font-family:Inter,sans-serif;padding:4px;">
                                <b style="font-size:14px;color:#00d4aa;">${v.name}</b><br>
                                <span style="font-size:12px;color:#666;">Status: <span style="color:${v.status === 'spawned' ? '#00d4aa' : v.status === 'garage' ? '#3742fa' : '#ff4757'};text-transform:capitalize;">${v.status}</span></span><br>
                                <span style="font-size:11px;color:#888;">Coords: ${v.x.toFixed(1)}, ${v.y.toFixed(1)}</span>
                            </div>
                        `);
                    vehicleCount++;
                }
            }
            
            // Add house markers
            for (const h of data.data.houses) {
                if (h.x && h.y) {
                    const lat = 3000 - (h.y + 1500);
                    const lng = h.x + 1500;
                    
                    L.marker([lat, lng], { icon: houseIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="font-family:Inter,sans-serif;padding:4px;">
                                <b style="font-size:14px;color:#ff6b35;">${h.name}</b><br>
                                <span style="font-size:11px;color:#888;">Coords: ${h.x.toFixed(1)}, ${h.y.toFixed(1)}</span>
                            </div>
                        `);
                    houseCount++;
                }
            }
            
            document.getElementById("map-vehicle-count").innerText = `${vehicleCount} vehicles`;
            document.getElementById("map-house-count").innerText = `${houseCount} houses`;
            
            // Fit bounds if we have markers
            if (vehicleCount > 0 || houseCount > 0) {
                const group = new L.featureGroup();
                map.eachLayer(layer => {
                    if (layer instanceof L.Marker) group.addLayer(layer);
                });
                if (group.getLayers().length > 0) {
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            }
        }
    } catch (err) {
        console.error("Map data error:", err);
        content.innerHTML += `<div style="color:#ff4757;margin-top:10px;"><i class="fas fa-exclamation-circle"></i> Error loading map data</div>`;
    }
}

async function sendFriendRequest(targetUid) {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/friends/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ targetUid })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadFriends();
    } catch (err) {
        console.error(err);
        alert("Failed to send request");
    }
}

async function acceptFriendRequest(requestId) {
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/friends/accept", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ requestId })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) loadFriends();
    } catch (err) {
        console.error(err);
        alert("Failed to accept request");
    }
}

async function removeFriend(friendId) {
    if (!confirm("Remove this friend?")) return;
    const token = localStorage.getItem("token");
    try {
        const res = await fetch(API + "/friends/" + friendId, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (data.success) loadFriends();
    } catch (err) {
        console.error(err);
        alert("Failed to remove friend");
    }
}

    const token = localStorage.getItem("token");
    
    try {
        const res = await fetch(API + "/player/" + targetUid, {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        
        if (!data.success) {
